group 'com.amolg.flutterbarcodescanner'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()          // was mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'   // was 4.1.3
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()          // was mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {

    namespace 'com.amolg.flutterbarcodescanner'
    compileSdkVersion 36       // was 30

    defaultConfig {
        minSdkVersion 21       // was 16
        targetSdkVersion 34    // was 30
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {                     // was lintOptions (deprecated in AGP 8)
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
}
